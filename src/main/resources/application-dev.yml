spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:your-system-email@gmail.com}
    password: ${EMAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  notification:
    mail:
      from-address: no-reply@digital-lending.com
  servicing:
    enabled: ${SERVICING_ENABLED:false}
    cron: ${SERVICING_CRON:0 0 * * * *}
    base-url: ${SERVICING_BASE_URL:http://localhost:${APP_PORT}}

server:
  port: ${APP_PORT}

jwt:
  secret: ${JWT_SECRET}
  tokenValiditySpan: 1800000
